name: release

on:
  workflow_call:
    inputs:
        upload-type:
            required: true
            type: string
  workflow_dispatch:
    inputs:
      upload-type:
        description: Release channel
        type: choice
        options: [installer-dev, installer]
        default: installer-dev
        required: true


jobs:
  build:
    uses: ./.github/workflows/build.yaml

  upload-artefact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v8
        with:
          name: installer-build
          path: releases/.

      - name: Push to Bunny
        env:
          PKG_URL: "https://storage.bunnycdn.com/${{ vars.BUNNY_STORAGE_ZONE }}/${{ inputs.upload-type }}"
          PKG_VER: "installer-${{ needs.build.outputs.installer_ver }}"
          UPLOAD_TYPE: "${{ inputs.upload-type }}"
          ACCESS_KEY: ${{ secrets.BUNNY_TOKEN }}
        run: |
          if [ ! -e "releases/${PKG_VER}" ]; then
              echo "Package not found!"
              exit 1
          fi

          case "$UPLOAD_TYPE" in
            installer) BOOTSTRAP=bootstrap-prod.sh ;;
            installer-dev) BOOTSTRAP=bootstrap-dev.sh ;;
            *) echo "Unknown installer release channel" >&2; exit 1 ;;
          esac
          test -f "releases/${PKG_VER}.sha256"
          test -f "releases/${BOOTSTRAP}"

          upload() {
               curl -# --fail --request PUT \
                   --url "${2}" \
                   --variable %ACCESS_KEY \
                   --expand-header 'AccessKey: {{ACCESS_KEY}}' \
                   -H "Content-Type: ${3}" \
                   -H "Accept: application/json" \
                   --data-binary @${1}
          }

          upload "releases/${PKG_VER}" "${PKG_URL}/${PKG_VER}" "application/octet-stream"
          upload "releases/${PKG_VER}.sha256" "${PKG_URL}/${PKG_VER}.sha256" "text/plain"
          upload "releases/latest" "${PKG_URL}/latest" "text/plain"
          upload "releases/${BOOTSTRAP}" "${PKG_URL}/bootstrap.sh" "text/plain"
